services:
  # ==========================
  # Development services
  # ==========================
  frontend-dev:
    container_name: textfsm-editor-frontend-dev
    build:
      context: frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - "${FRONTEND_PORT_DEV:-5173}:5173"
    environment:
      - VITE_API_ENTRYPOINT_DEV=${VITE_API_ENTRYPOINT_DEV:-http://localhost:8000}
    stdin_open: true
    develop:
      watch:
        - action: rebuild
          path: package.json
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - node_modules
    depends_on:
      - backend-dev
    profiles:
      - dev

  backend-dev:
    container_name: textfsm-editor-backend-dev
    build:
      context: backend
      dockerfile: Dockerfile
      target: development
    ports:
      - "${BACKEND_PORT_DEV:-8000}:8000"
    environment:
      - MODE=development
      - LOG_LEVEL=DEBUG
      - DOCS_ENABLED=true
    volumes:
      - ./backend/src:/app/src
    profiles:
      - dev

  # ==========================
  # Production services (Backend serves static files)
  # ==========================
  frontend-build:
    container_name: textfsm-editor-frontend-build
    build:
      context: frontend
      dockerfile: Dockerfile
      target: static-export
    volumes:
      - static-files:/app/dist
    profiles:
      - prod

  backend-prod:
    container_name: textfsm-editor-backend-prod
    build:
      context: backend
      dockerfile: Dockerfile
      target: production
    ports:
      - "${BACKEND_PORT_PROD:-8000}:8000"
    environment:
      - MODE=production
      - LOG_LEVEL=${LOG_LEVEL:-WARNING}
      - DOCS_ENABLED=${DOCS_ENABLED:-false}
      - PUBLIC_DIR=/app/public
      - STATIC_DIR=/app/public/static
      - ENABLE_HTTPS_REDIRECT=${ENABLE_HTTPS_REDIRECT:-false}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
    volumes:
      - static-files:/app/public/static
    depends_on:
      frontend-build:
        condition: service_completed_successfully
    profiles:
      - prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ==========================
  # Production services (Nginx + Backend)
  # ==========================
  frontend-nginx:
    container_name: textfsm-editor-frontend-nginx
    build:
      context: frontend
      dockerfile: Dockerfile
      target: production
    ports:
      - "${FRONTEND_PORT_PROD:-80}:80"
    depends_on:
      backend-api:
        condition: service_healthy
    profiles:
      - prod-nginx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  backend-api:
    container_name: textfsm-editor-backend-api
    build:
      context: backend
      dockerfile: Dockerfile
      target: production
    expose:
      - "8000"
    environment:
      - MODE=production
      - LOG_LEVEL=${LOG_LEVEL:-WARNING}
      - DOCS_ENABLED=${DOCS_ENABLED:-false}
      - ENABLE_HTTPS_REDIRECT=false
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
    profiles:
      - prod-nginx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  static-files:

